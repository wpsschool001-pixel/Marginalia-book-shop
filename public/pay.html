<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pay to unlock — Smartef Bookshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
  .pay-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .pay-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 36px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: var(--shadow);
  }
  .pay-back {
    display: inline-block;
    margin-bottom: 20px;
    font-size: 0.85rem;
    color: var(--ink-dim);
    text-decoration: none;
  }
  .pay-cover {
    height: 140px;
    border-radius: 8px;
    display: flex;
    align-items: flex-end;
    padding: 14px;
    margin-bottom: 18px;
  }
  .pay-cover .initial { font-family: var(--font-display); font-size: 2.6rem; color: rgba(255,255,255,0.35); font-weight: 600; }
  .pay-title { font-size: 1.4rem; margin: 0 0 4px; font-family: var(--font-display); font-weight: 600; }
  .pay-author { color: var(--ink-dim); font-size: 0.92rem; margin: 0 0 20px; }
  .pay-price-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-top: 1px solid rgba(34,31,26,0.15); border-bottom: 1px solid rgba(34,31,26,0.15);
    margin-bottom: 22px; font-family: var(--font-mono);
  }
  .pay-price { font-size: 1.3rem; color: var(--red); font-weight: 500; }
  .pay-submit {
    width: 100%; padding: 13px; border-radius: 6px; border: none;
    background: var(--ink); color: var(--paper); font-weight: 600; font-size: 0.95rem; cursor: pointer;
  }
  .pay-status { margin-top: 14px; font-size: 0.88rem; text-align: center; color: var(--ink-dim); }
  .pay-status.success { color: #2f6b3a; font-weight: 600; }
  .pay-status.error { color: var(--red); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="pay-wrap">
  <div class="pay-card">
    <a class="pay-back" href="/">← Back to Smartef Bookshop</a>
    <div id="payContent">Loading book…</div>
  </div>
</div>
<script src="/pay.js"></script>
</body>
</html>
